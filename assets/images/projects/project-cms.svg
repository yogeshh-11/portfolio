<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#101d42"/>
      <stop offset="100%" stop-color="#070b19"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c52" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#141f3d" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#cmsBg)"/>

  <!-- Ambient background glow -->
  <circle cx="650" cy="120" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="380" r="160" fill="#2563eb" opacity="0.15" filter="url(#glow)"/>

  <!-- Browser/App Mockup Frame -->
  <g transform="translate(40, 30)">
    <!-- Window outer box -->
    <rect width="720" height="420" rx="14" fill="#0d1527" stroke="#1e2c52" stroke-width="1.5"/>
    
    <!-- Title bar -->
    <path d="M 0 14 Q 0 0 14 0 L 706 0 Q 720 0 720 14 L 720 44 L 0 44 Z" fill="#141f36"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="22" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#0b1120" stroke="#1f2d4d" stroke-width="1"/>
    <text x="360" y="26" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">admin.yogesh-portfolio.dev/cms</text>

    <!-- Sidebar -->
    <rect x="0" y="44" width="160" height="376" fill="#0c1322" stroke="#1a2540" stroke-width="1"/>
    <text x="24" y="80" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">CMS CONSOLE</text>

    <!-- Sidebar items -->
    <rect x="16" y="98" width="128" height="32" rx="6" fill="#1d2847"/>
    <rect x="16" y="98" width="4" height="32" rx="2" fill="#38bdf8"/>
    <text x="36" y="119" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Dashboard</text>

    <text x="36" y="155" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Projects (3)</text>
    <text x="36" y="190" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Skills Grid</text>
    <text x="36" y="225" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Education</text>
    <text x="36" y="260" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Resume PDF</text>
    <text x="36" y="295" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Settings</text>

    <!-- Main Content Area -->
    <!-- Top Stat Cards -->
    <g transform="translate(180, 64)">
      <!-- Stat 1 -->
      <rect width="160" height="74" rx="10" fill="url(#cardGrad)" stroke="#233561" stroke-width="1"/>
      <text x="16" y="26" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">TOTAL SECTIONS</text>
      <text x="16" y="54" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">8 Active</text>
      <circle cx="136" cy="36" r="14" fill="#2563eb" fill-opacity="0.25"/>
      <text x="136" y="41" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">✓</text>

      <!-- Stat 2 -->
      <rect x="175" width="160" height="74" rx="10" fill="url(#cardGrad)" stroke="#233561" stroke-width="1"/>
      <text x="191" y="26" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">DATABASE SYNC</text>
      <text x="191" y="54" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">MySQL Live</text>

      <!-- Stat 3 -->
      <rect x="350" width="160" height="74" rx="10" fill="url(#cardGrad)" stroke="#233561" stroke-width="1"/>
      <text x="366" y="26" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">UI ARCHITECTURE</text>
      <text x="366" y="54" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">React Components</text>
    </g>

    <!-- Data Table / Management view -->
    <g transform="translate(180, 156)">
      <rect width="510" height="236" rx="10" fill="#0e172a" stroke="#1e2c52" stroke-width="1"/>
      
      <!-- Table Header -->
      <path d="M 0 10 Q 0 0 10 0 L 500 0 Q 510 0 510 10 L 510 36 L 0 36 Z" fill="#15213d"/>
      <text x="20" y="23" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MODULE NAME</text>
      <text x="190" y="23" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TECH STACK</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">STATUS</text>
      <text x="440" y="23" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ACTIONS</text>

      <!-- Row 1 -->
      <line x1="0" y1="76" x2="510" y2="76" stroke="#1c2949" stroke-width="1"/>
      <text x="20" y="60" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Project Manager</text>
      <text x="190" y="60" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">React, REST, MySQL</text>
      <rect x="330" y="47" width="60" height="20" rx="10" fill="#10b981" fill-opacity="0.15"/>
      <text x="360" y="61" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ONLINE</text>
      <rect x="430" y="48" width="56" height="18" rx="4" fill="#2563eb"/>
      <text x="458" y="61" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Manage</text>

      <!-- Row 2 -->
      <line x1="0" y1="116" x2="510" y2="116" stroke="#1c2949" stroke-width="1"/>
      <text x="20" y="100" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Education Timeline</text>
      <text x="190" y="100" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Dynamic Node Array</text>
      <rect x="330" y="87" width="60" height="20" rx="10" fill="#10b981" fill-opacity="0.15"/>
      <text x="360" y="101" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ONLINE</text>
      <rect x="430" y="88" width="56" height="18" rx="4" fill="#2563eb"/>
      <text x="458" y="101" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Manage</text>

      <!-- Row 3 -->
      <line x1="0" y1="156" x2="510" y2="156" stroke="#1c2949" stroke-width="1"/>
      <text x="20" y="140" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Skills Matrix</text>
      <text x="190" y="140" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Categorized Badges</text>
      <rect x="330" y="127" width="60" height="20" rx="10" fill="#10b981" fill-opacity="0.15"/>
      <text x="360" y="141" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ONLINE</text>
      <rect x="430" y="128" width="56" height="18" rx="4" fill="#2563eb"/>
      <text x="458" y="141" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Manage</text>

      <!-- Floating Tech Badge Footer -->
      <rect x="18" y="180" width="474" height="42" rx="8" fill="#141f36" stroke="#233561" stroke-width="1"/>
      <text x="32" y="206" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">TECH ARCHITECTURE:</text>
      <rect x="160" y="190" width="62" height="22" rx="4" fill="#0284c7" fill-opacity="0.3"/>
      <text x="191" y="205" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">React.js</text>
      <rect x="230" y="190" width="56" height="22" rx="4" fill="#6366f1" fill-opacity="0.3"/>
      <text x="258" y="205" fill="#a5b4fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Figma</text>
      <rect x="294" y="190" width="60" height="22" rx="4" fill="#0d9488" fill-opacity="0.3"/>
      <text x="324" y="205" fill="#5eead4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">MySQL</text>
      <rect x="362" y="190" width="80" height="22" rx="4" fill="#3b82f6" fill-opacity="0.3"/>
      <text x="402" y="205" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Admin CMS</text>
    </g>
  </g>
</svg>
