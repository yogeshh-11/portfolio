<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="donorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#15132d"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#0e1322"/>
    </linearGradient>
    <linearGradient id="bloodPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#donorBg)"/>

  <!-- Background Ambience -->
  <circle cx="200" cy="240" r="140" fill="#ef4444" opacity="0.12" filter="url(#glowRed)"/>
  <circle cx="620" cy="200" r="160" fill="#2563eb" opacity="0.14" filter="url(#glowBlue)"/>

  <!-- Left: Mobile iOS Screen Frame -->
  <g transform="translate(70, 30)">
    <!-- Device Body -->
    <rect width="250" height="420" rx="36" fill="url(#phoneGrad)" stroke="#2b395d" stroke-width="2.5"/>
    
    <!-- Dynamic Island / Notch -->
    <rect x="80" y="14" width="90" height="18" rx="9" fill="#050811"/>
    <circle cx="150" cy="23" r="3" fill="#1e293b"/>

    <!-- App Header -->
    <text x="24" y="62" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16">BloodConnect</text>
    <rect x="180" y="48" width="46" height="20" rx="10" fill="#ef4444" fill-opacity="0.2"/>
    <text x="203" y="62" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" text-anchor="middle">LIVE SOS</text>

    <!-- Radar Map Preview -->
    <rect x="18" y="76" width="214" height="130" rx="14" fill="#0d182d" stroke="#1d2d50" stroke-width="1"/>
    <circle cx="125" cy="141" r="50" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <circle cx="125" cy="141" r="30" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
    <circle cx="125" cy="141" r="6" fill="#38bdf8"/>
    
    <!-- Pulse pins on radar -->
    <circle cx="100" cy="118" r="9" fill="#ef4444"/>
    <text x="100" y="121" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">O+</text>
    
    <circle cx="155" cy="155" r="9" fill="#ef4444"/>
    <text x="155" y="158" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">B+</text>

    <!-- Nearby Donor Alert Card -->
    <rect x="18" y="218" width="214" height="96" rx="12" fill="#142038" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
    <text x="30" y="238" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">EMERGENCY MATCH</text>
    <text x="30" y="256" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">O+ Blood Required</text>
    <text x="30" y="272" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">Civil Hospital, Sangli • 1.4 km away</text>
    
    <!-- Action buttons inside card -->
    <rect x="30" y="282" width="78" height="22" rx="6" fill="#ef4444"/>
    <text x="69" y="296" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Accept</text>
    <rect x="116" y="282" width="78" height="22" rx="6" fill="#1e293b"/>
    <text x="155" y="296" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Decline</text>

    <!-- Bottom Tab Navigation -->
    <rect x="18" y="324" width="214" height="50" rx="12" fill="#0d1527"/>
    <circle cx="55" cy="349" r="12" fill="#2563eb" fill-opacity="0.3"/>
    <text x="55" y="353" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">🗺️</text>
    <text x="125" y="353" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">🩸</text>
    <text x="195" y="353" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">👤</text>
    
    <!-- Home Bar -->
    <rect x="85" y="398" width="80" height="4" rx="2" fill="#475569"/>
  </g>

  <!-- Right: UI/UX Process & Tech Architecture Flow -->
  <g transform="translate(360, 48)">
    <rect width="390" height="384" rx="16" fill="#0d162b" stroke="#1e2c52" stroke-width="1.5"/>
    
    <!-- Header -->
    <text x="24" y="38" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16">UI/UX Design Architecture</text>
    <text x="24" y="58" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12">End-to-End iOS Interaction Process</text>

    <!-- Step 1 Card: Research & Wireframing -->
    <g transform="translate(24, 76)">
      <rect width="342" height="66" rx="10" fill="#13203c" stroke="#253b6b" stroke-width="1"/>
      <circle cx="28" cy="33" r="14" fill="#6366f1" fill-opacity="0.25"/>
      <text x="28" y="38" fill="#a5b4fc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" text-anchor="middle">01</text>
      <text x="54" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Figma UX Wireframing</text>
      <text x="54" y="48" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Donor onboarding, urgent SOS cards, &amp; alert hierarchy</text>
    </g>

    <!-- Step 2 Card: CoreML & Smart Match -->
    <g transform="translate(24, 154)">
      <rect width="342" height="66" rx="10" fill="#13203c" stroke="#253b6b" stroke-width="1"/>
      <circle cx="28" cy="33" r="14" fill="#0284c7" fill-opacity="0.25"/>
      <text x="28" y="38" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" text-anchor="middle">02</text>
      <text x="54" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Live Geo-Radar &amp; Compatibility</text>
      <text x="54" y="48" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Real-time distance ranking &amp; blood group compatibility</text>
    </g>

    <!-- Step 3 Card: SwiftUI Implementation -->
    <g transform="translate(24, 232)">
      <rect width="342" height="66" rx="10" fill="#13203c" stroke="#253b6b" stroke-width="1"/>
      <circle cx="28" cy="33" r="14" fill="#10b981" fill-opacity="0.25"/>
      <text x="28" y="38" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" text-anchor="middle">03</text>
      <text x="54" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">SwiftUI Native Implementation</text>
      <text x="54" y="48" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Fluid micro-interactions &amp; instant emergency response</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(24, 320)">
      <rect width="76" height="26" rx="6" fill="#f43f5e" fill-opacity="0.2"/>
      <text x="38" y="337" fill="#fb7185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SwiftUI</text>

      <rect x="86" width="70" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="121" y="337" fill="#c4b5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Figma</text>

      <rect x="166" width="76" height="26" rx="6" fill="#0ea5e9" fill-opacity="0.2"/>
      <text x="204" y="337" fill="#7dd3fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CoreML</text>

      <rect x="252" width="90" height="26" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="297" y="337" fill="#6ee7b7" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Team Project</text>
    </g>
  </g>
</svg>
